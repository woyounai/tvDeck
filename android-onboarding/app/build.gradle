plugins { id 'com.android.application' }

android {
    namespace 'com.tvadb.onboarding'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tvadb.onboarding'
        minSdk 23
        targetSdk 28
        versionCode = (System.getenv('TVADB_VERSION_CODE') ?: '1').toInteger()
        versionName = (System.getenv('TVADB_VERSION_NAME') ?: '1.0')
    }
    // Direct-distribution companion retains legacy LAN behavior; store targeting needs a separate migration.
    lint { disable 'ExpiredTargetSdkVersion' }
    buildTypes {
        release { minifyEnabled false }
    }
}
