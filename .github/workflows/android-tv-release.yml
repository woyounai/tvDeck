name: TV companion signed Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'APK version name, e.g. 0.1.1 (without v)'
        required: true
        type: string
      version_code:
        description: 'APK version code: positive integer, higher than previous release'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_VERSION: '21'
      TVADB_VERSION_NAME: ${{ inputs.version }}
      TVADB_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TVADB_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Version must look like 0.1.1 or 0.1.1-beta.1' >&2; exit 1;
          }
          [[ "$TVADB_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && (( TVADB_VERSION_CODE <= 2100000000 )) || {
            echo 'Version code must be between 1 and 2100000000' >&2; exit 1;
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check release scripts
        run: |
          python3 tests/test_android_release_scripts.py
          python3 tests/test_github_android_signing.py
          python3 tests/test_android_release_workflows.py
      - name: Build and sign TVDeck Connect
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          TVADB_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          TVADB_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          TVADB_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          TVADB_KEYSTORE: ${{ runner.temp }}/tvadb-release.jks
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${TVADB_KEY_ALIAS:?Missing release alias secret}"
          : "${TVADB_STORE_PASSWORD:?Missing release store password secret}"
          : "${TVADB_KEY_PASSWORD:?Missing release key password secret}"
          umask 077
          trap 'rm -f "$TVADB_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$TVADB_KEYSTORE"
          ./scripts/build-android-tv-release.sh
          cd dist
          sha256sum TVDeck-Connect-release.apk > SHA256SUMS
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tvadb-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: TVDeck-Connect-${{ inputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/TVDeck-Connect-release.apk
            dist/SHA256SUMS
      - name: Create Release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "tv-v$TVADB_VERSION_NAME" \
            "dist/TVDeck-Connect-release.apk" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --draft \
            --title "TVDeck Connect $TVADB_VERSION_NAME" \
            --notes "TVDeck Connect $TVADB_VERSION_NAME (versionCode $TVADB_VERSION_CODE). Review the APK and checksum before publishing. Source: $GITHUB_SHA."
